# RustDesk 자체 호스팅 묶음: API(이 저장소) + 공식 hbbs/hbbr.
# 모든 포트는 서버 PC 의 Tailscale IP(${TS_IP}) 에만 열린다.
#
# 사용:  cd deploy && cp .env.example .env && (TS_IP 채우기) && docker compose up -d --build
name: rustdesk

services:
  # API 서버. network_mode: host 를 쓰는 이유:
  #  1) 앱이 LISTEN_ADDR(=${TS_IP}:21114) 에만 bind 하고, Tailscale 대역이 아니면 시작을 거부한다.
  #     bridge 네트워크에서는 컨테이너 안에 Tailscale IP 가 없어 이 검사를 지킬 수 없다.
  #  2) 403 방어가 실제 접속 원본 IP 를 봐야 한다. bridge + docker-proxy 경로에서는 원본이
  #     브리지 게이트웨이(172.x)로 바뀔 수 있다.
  # 앱이 특정 IP 하나에만 bind 하므로 host 모드여도 다른 인터페이스(공인/LAN)에는 열리지 않는다.
  api:
    build:
      context: ..
    image: rustdesk-tailnet-api:local
    network_mode: host
    environment:
      LISTEN_ADDR: "${TS_IP:?TS_IP 를 .env 에 설정하세요}:${API_PORT:-21114}"
      DB_PATH: /data/api.db
      TOKEN_TTL: "${TOKEN_TTL:-720h}"
      # Pushed to every logged-in device as its ID / relay / API server and Key.
      SERVER_HOST: "${SERVER_HOST:-${TS_IP}}"
      HBBS_KEY_FILE: /rustdesk/id_ed25519.pub
      HBBS_PORT: "${HBBS_PORT:-21116}"
      HBBR_PORT: "${HBBR_PORT:-21117}"
    volumes:
      - api-data:/data
      - ./data/rustdesk:/rustdesk:ro
    restart: unless-stopped

  # ID/랑데부 서버. hbbs 에는 bind 주소 옵션이 없으므로 bridge 네트워크 + Tailscale IP 로만 publish.
  #  21115/tcp NAT 유형 검사, 21116/tcp+udp ID 등록·홀펀칭.
  #  21118(웹 클라이언트용 websocket)은 쓰지 않으므로 열지 않는다.
  hbbs:
    image: "rustdesk/rustdesk-server:${RUSTDESK_SERVER_TAG:-1.1.16}"
    # Host networking: behind docker-proxy hbbs sees every device as the bridge gateway
    # and can no longer reach them for punch / relay requests. hbbs cannot bind one
    # address, so firewall.sh limits its ports to tailscale0.
    # Ports: HBBS_PORT-1 (NAT test), HBBS_PORT tcp+udp, HBBS_PORT+2 (websocket, unused).
    network_mode: host
    command: ["hbbs", "-p", "${HBBS_PORT:-21116}", "-r", "${TS_IP:?TS_IP 를 .env 에 설정하세요}:${HBBR_PORT:-21117}"]
    volumes:
      - ./data/rustdesk:/root   # id_ed25519 / id_ed25519.pub (클라이언트 Key) 가 여기에 생긴다
    depends_on:
      - hbbr
    restart: unless-stopped

  # 릴레이 서버. HBBR_PORT tcp (HBBR_PORT+2 websocket 은 쓰지 않음). hbbs 와 같은 키를 쓴다.
  hbbr:
    image: "rustdesk/rustdesk-server:${RUSTDESK_SERVER_TAG:-1.1.16}"
    network_mode: host
    command: ["hbbr", "-p", "${HBBR_PORT:-21117}"]
    volumes:
      - ./data/rustdesk:/root
    restart: unless-stopped

volumes:
  api-data:
